<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Shiny app</title>
  </head>
  <body>
    <header class="viewer-bar">
      <span class="viewer-address" id="address"></span>
      <button type="button" id="open" class="viewer-button">Open in browser</button>
      <button type="button" id="reload" class="viewer-button" aria-label="Reload the app" title="Reload the app">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v2.2h-2.2" />
        </svg>
      </button>
    </header>
    <iframe id="app" title="The running app" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"></iframe>
    <script type="module" src="/src/appWindow.ts"></script>
  </body>
</html>
