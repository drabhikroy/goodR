# Builds the universal Mac app, signs it with the Developer ID certificate,
# notarizes the app and the disk image, and attaches the disk image to a
# draft release. Nothing is published until the draft is reviewed and
# published by hand.
#
# Runs only by hand, from the Actions tab or with
# `gh workflow run release-macos.yml --ref v1.2.3`, so a release made on a
# Mac with scripts/release-mac.sh never starts it. Run on a version tag, it
# makes a draft release. Run on a branch, it keeps the disk image as a
# workflow artifact and makes no release.
#
# Repository secrets used:
#   CSC_LINK                      base64 of the exported .p12 certificate
#   CSC_KEY_PASSWORD              password for that .p12
#   APPLE_API_KEY_P8              text of the App Store Connect API key, the .p8 file
#   APPLE_API_KEY_ID              that key's ten character ID
#   APPLE_API_ISSUER              the issuer ID shown above the keys in App Store Connect
#   TAURI_SIGNING_PRIVATE_KEY     key that signs updates, from tauri signer generate
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password, if it has one
#
# And one repository variable:
#   GOODR_UPDATER_PUBKEY          the public half of that key, built into the
#                                 app so it can check each update it installs
#
# Without the signing key the release still builds. The app it makes sends
# people to the release page for updates instead of updating itself.
name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      APP: ${{ github.workspace }}/target/universal-apple-darwin/release/bundle/macos/goodR.app
      HAS_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release

      # Installed copies compare the tag's version with their own, so a tag
      # that does not match the version in the files would offer the same
      # update forever.
      - name: Confirm the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for found in "$(jq -r .version src-tauri/tauri.conf.json)" "$(jq -r .version package.json)" "$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"; do
            if [ "$found" != "$tag" ]; then echo "The tag says $tag but a file says $found."; exit 1; fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Download ark
        run: |
          node scripts/fetch-ark.mjs universal-apple-darwin

      - name: Checks before building
        run: |
          npm run standards
          npm run audit:contrast
          npm test

      # notarytool reads the API key from a file, kept outside the project
      # and removed with the runner.
      - name: Write the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Tauri imports the certificate into a temporary keychain, signs ark
      # and the app with the hardened runtime and entitlements.plist, then
      # notarizes and staples the app.
      - name: Build, sign, and notarize the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Public, built into the app so it can check its updates. Left out
          # when there is no signing key, so that build sends people to the
          # release page instead.
          GOODR_UPDATER_PUBKEY: ${{ env.HAS_UPDATE_KEY == 'true' && vars.GOODR_UPDATER_PUBKEY || '' }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      # ark loads libR from the R Foundation build, which is signed by a
      # different team. Without this entitlement on ark itself, R fails to
      # start in the released app even though every check above passes.
      - name: Confirm ark carries the library validation entitlement
        run: |
          codesign -d --entitlements - "$APP/Contents/MacOS/ark" 2>&1 | tee entitlements.txt
          grep -q "disable-library-validation" entitlements.txt

      - name: Run the R tests against the signed ark
        env:
          GOODFOR_ARK: ${{ env.APP }}/Contents/MacOS/ark
        run: cargo test -p rsession --test integration

      # Tauri notarizes the app inside the disk image but not the disk image
      # itself, so the disk image gets its own ticket here.
      - name: Notarize and staple the disk image
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          source="$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)"
          cp "$source" goodR.dmg
          xcrun notarytool submit goodR.dmg --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple goodR.dmg
          xcrun stapler validate goodR.dmg
          spctl --assess --type execute --verbose=4 "$APP"
          shasum -a 256 goodR.dmg | tee goodR.dmg.sha256

      # The notarized app, packed as Tauri's updater fetches it. The update
      # key is given to this step alone, which only packs and signs, so
      # nothing run during the build can read it.
      - name: Sign the in-app update
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tar -czf goodR.app.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          npx tauri signer sign --app-version "${GITHUB_REF_NAME#v}" goodR.app.tar.gz

      # The small file that tells installed copies a new version is out.
      # Both Mac chips use the one universal build.
      - name: Write latest.json
        if: env.HAS_UPDATE_KEY == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/goodR.app.tar.gz"
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg url "$url" --rawfile signature goodR.app.tar.gz.sig \
            '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}, "darwin-x86_64": {signature: $signature, url: $url}}}' > latest.json

      - name: Keep the disk image as a workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: goodr-mac
          path: |
            goodR.dmg
            goodR.dmg.sha256
          if-no-files-found: error

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          files="goodR.dmg goodR.dmg.sha256"
          if [ -f latest.json ]; then files="$files goodR.app.tar.gz latest.json"; fi
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" $files --draft --title "goodR ${GITHUB_REF_NAME#v}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" $files --draft --title "goodR ${GITHUB_REF_NAME#v}" --notes ""
          fi
