# Builds the Linux and Windows installers and attaches them, with a checksum
# file for each system, to the release for the tag. If the Mac release is
# already there as a draft, they join it. If not, they start the draft.
# Nothing is published until the draft is reviewed and published by hand.
#
# Runs only by hand, from the Actions tab or with
# `gh workflow run release-linux-windows.yml --ref v1.2.3`, which needs the
# tag pushed first. Run on a branch, it keeps the installers as workflow
# artifacts and makes no release.
#
# Both are previews: neither has been tried on a real desktop by the
# project, and the Windows installer is not code signed, so Windows shows
# its "Windows protected your PC" notice the first time it is opened.
name: Release Linux and Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported Ubuntu, since a program built against an older
    # system library runs on newer systems but not the other way round.
    # Each kind of processor builds on a machine of its own kind, because
    # the program and the libraries it links to must match the processor.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            deb: amd64
            appimage: x86_64
            label: x64
          - runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            deb: arm64
            appimage: aarch64
            label: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install the libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Confirm the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for found in "$(jq -r .version src-tauri/tauri.conf.json)" "$(jq -r .version package.json)" "$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"; do
            if [ "$found" != "$tag" ]; then echo "The tag says $tag but a file says $found."; exit 1; fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Download ark
        run: node scripts/fetch-ark.mjs ${{ matrix.triple }}

      - name: Checks before building
        run: |
          npm run standards
          npm run audit:contrast
          npm test

      - name: Build the Debian package and the AppImage
        run: npx tauri build --bundles deb,appimage

      # Named the way the Mac installer is, so the release page lists each
      # system's files the same way.
      - name: Name the installers and write their checksums
        run: |
          version="$(jq -r .version package.json)"
          mkdir -p out
          cp target/release/bundle/deb/*.deb "out/goodR-$version-${{ matrix.deb }}.deb"
          cp target/release/bundle/appimage/*.AppImage "out/goodR-$version-${{ matrix.appimage }}.AppImage"
          cd out
          sha256sum goodR-* | tee SHA256SUMS-linux-${{ matrix.label }}.txt

      - name: Keep the installers as a workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: goodr-linux-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Confirm the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for found in "$(jq -r .version src-tauri/tauri.conf.json)" "$(jq -r .version package.json)" "$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"; do
            if [ "$found" != "$tag" ]; then echo "The tag says $tag but a file says $found."; exit 1; fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Download ark
        run: node scripts/fetch-ark.mjs x86_64-pc-windows-msvc

      - name: Checks before building
        run: |
          npm run standards
          npm run audit:contrast
          npm test

      # The NSIS installer installs for the current user alone, so it needs
      # no administrator password, and fetches WebView2 if Windows lacks it.
      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Name the installer and write its checksum
        run: |
          version="$(jq -r .version package.json)"
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe "out/goodR-$version-x64-setup.exe"
          cd out
          sha256sum goodR-* | tee SHA256SUMS-windows.txt

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: goodr-windows
          path: out/*
          if-no-files-found: error

  # Attaching happens once, after both builds, so the two never race to
  # start the release. GitHub allows several drafts with one tag, so an
  # existing release, the Mac draft included, is looked for first and
  # joined, and a new draft is made only when there is none.
  attach:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: out
          merge-multiple: true

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls out/goodR-* out/SHA256SUMS-*.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber --repo "$GITHUB_REPOSITORY"
          else
            notes="docs/release-notes/${GITHUB_REF_NAME}.md"
            [ -f "$notes" ] || notes=/dev/null
            gh release create "$GITHUB_REF_NAME" $files --draft --title "goodR ${GITHUB_REF_NAME#v}" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          fi
