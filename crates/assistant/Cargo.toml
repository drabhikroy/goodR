[package]
name = "assistant"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The optional local model assistant: Ollama setup, a model catalog, and prompts for help with R."
publish = false

[dependencies]
anyhow = "1"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
